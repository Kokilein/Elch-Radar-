name: Elch Radar Norwegen

on:
  schedule:
    # Läuft alle 15 Minuten rund um die Uhr
    - cron: '*/15 * * * *'
  # Erlaubt dir zusätzlich, das Skript jederzeit manuell per Klick zu starten
  workflow_dispatch:

# Verhindert, dass sich zwei Durchläufe gleichzeitig in die Quere kommen
concurrency:
  group: elch-radar-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Telegram Test-Nachricht (nur bei manuellem Start)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="🦌 Elch-Radar Test: Die Verbindung zu GitHub steht!")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"error_code":429'; then
            echo "Kurze Telegram-Pause (35s), versuche es gleich noch einmal..."
            sleep 35
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${CHAT_ID}" \
              -d text="🦌 Elch-Radar Test: Die Verbindung zu GitHub steht!"
          fi

      - name: Code laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: KI-Bibliotheken installieren
        run: |
          pip install ultralytics requests --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Norwegen nach Elchen scannen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM
