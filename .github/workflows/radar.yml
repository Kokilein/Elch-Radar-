name: Elch Radar Norwegen

on:
  schedule:
    # Läuft alle 10 Minuten rund um die Uhr
    - cron: '*/10 * * * *'
  # Erlaubt dir zusätzlich, das Skript jederzeit manuell per Klick zu starten
  workflow_dispatch:

# Verhindert, dass sich zwei Durchläufe gleichzeitig in die Quere kommen
concurrency:
  group: elch-radar-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Telegram Test-Nachricht (nur bei manuellem Start)
        if: github.event_name == 'workflow_dispatch'
        env:
          RAW_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RAW_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          CID=$(printf '%s' "$RAW_CHAT_ID" | tr -d '[:space:]')
          RESPONSE=$(curl -4 -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d "chat_id=${CID}" -d "text=🦌 Elch-Radar Test: Die Verbindung zu GitHub steht!")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"error_code":429'; then
            echo "Kurze Telegram-Pause (35s), versuche es gleich noch einmal..."
            sleep 35
            curl -4 -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -d "chat_id=${CID}" -d "text=🦌 Elch-Radar Test: Die Verbindung zu GitHub steht!"
          fi

      - name: Code laden
        uses: actions/checkout@v4

      - name: KI-Bibliotheken installieren
        run: |
          pip install ultralytics requests --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Norwegen nach Elchen scannen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python elch_scanner.py

      - name: Verlauf speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "ElchBot"
          git add seen_moose.json || true
          git commit -m "Update seen moose" || exit 0
          git pull --rebase
          git push
